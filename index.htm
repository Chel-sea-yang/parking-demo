<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>全自訂佈局與出入口智慧尋路機械車位模擬系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Microsoft JhengHei', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
        }
        /* 控制面板 */
        .control-panel {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* 車位棋盤區域 */
        .simulation-area {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* ========================================== */
        /* CRITICAL FIX: 確保車位格子顯示的網格核心樣式  */
        /* ========================================== */
        .parking-grid {
            display: grid;
            grid-template-columns: repeat(4, 120px); /* 4 欄 */
            grid-template-rows: repeat(3, 100px);    /* 3 列 */
            gap: 10px;
            background: #bdc3c7;
            padding: 15px;
            border-radius: 8px;
            position: relative;
        }
        /* 車位格基本外觀 */
        .car-space {
            background: #3498db;
            color: white;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
            user-select: none;
            width: 120px;
            height: 100px;
        }
        .car-space:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }
        /* 運轉空格樣式 */
        .car-space.empty {
            background: #ecf0f1;
            border: 2px dashed #95a5a6;
            box-shadow: none;
            color: #7f8c8d;
        }
        /* 結構牆壁樣式 */
        .car-space.wall {
            background: #95a5a6;
            color: #d5dbdb;
            border: 2px solid #7f8c8d;
            box-shadow: none;
        }
        .car-space.wall.edit-mode {
            opacity: 0.6;
            background: #7f8c8d;
        }
        .car-space.wall.run-mode {
            opacity: 0;
            cursor: default;
        }
        /* 出入口自訂樣式 */
        .car-space.gate {
            color: #2ecc71;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid #2ecc71;
            background-color: #ebfbee;
            box-shadow: none;
        }
        /* 目標出庫車樣式 */
        .car-space.target {
            background: #e74c3c;
        }
        
        /* 表格與按鈕樣式 */
        .step-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        .step-table th, .step-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .step-table th {
            background-color: #f2f2f2;
        }
        .status-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #e74c3c;
        }
        .mode-indicator {
            padding: 10px;
            background: #e8f4fd;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 15px;
            color: #2b6cb0;
            text-align: center;
            font-weight: bold;
            border: 1px solid #bee3f8;
        }
        .mode-indicator.edit {
            background: #feebc8;
            color: #dd6b20;
            border: 1px solid #fbd38d;
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #34495e;
        }
        .btn-toggle {
            background: #8e44ad;
        }
        .btn-toggle:hover {
            background: #9b59b6;
        }
        .btn-finder {
            background: #e67e22;
        }
        .btn-finder:hover {
            background: #d35400;
        }
    </style>
</head>
<body>

    <h1>全自訂基地與出入口 機械車位模擬系統</h1>
    <div class="subtitle">支援自由指定「出入口」、「車位」、「空格」與「柱子」之全能解說工具</div>

    <div class="container">
        <div class="control-panel">
            <h3>📊 運轉數據面板</h3>
            
            <div class="mode-indicator" id="mode-text">
                🎯 目前模式：簡報測試 (點車設為目標)
            </div>

            <div class="status-box">
                <div>目標出庫車：<span id="target-display" style="font-size:18px; color:#e74c3c; font-weight:bold;">無 (請點擊車位)</span></div>
                <div>目前出入口座標：<span id="gate-display" style="font-size:15px; color:#2ecc71; font-weight:bold;">未設定</span></div>
                <div>累積移動步數：<span id="step-count" style="font-size:18px; color:#e74c3c; font-weight:bold;">0</span> 步</div>
            </div>
            
            <button class="btn-toggle" id="toggle-btn" onclick="toggleMode()">🛠️ 切換至：自訂佈局(編輯模式)</button>
            <button class="btn-finder" id="finder-btn" onclick="runAutoFinder()">⚡ 智慧尋路：自動演示最佳路徑</button>
            <button onclick="resetGrid()">🔄 重置回初始狀態</button>
            
            <h3 style="margin-top:20px;">📋 搬移指令序列</h3>
            <div style="max-height: 180px; overflow-y: auto;">
                <table class="step-table">
                    <thead>
                        <tr>
                            <th>步驟</th>
                            <th>車位</th>
                            <th>X軸 (橫移)</th>
                            <th>Y軸 (升降)</th>
                        </tr>
                    </thead>
                    <tbody id="step-log">
                        <tr>
                            <td colspan="4" style="color:#95a5a6;">尚無移動數據</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="simulation-area">
            <h3 id="grid-title">🚗 機械車位矩陣（簡報測試中）</h3>
            <div class="parking-grid" id="grid">
                </div>
            <div id="tip-text" style="margin-top: 15px; color: #7f8c8d; font-size: 14px; text-align: center;">
                ※ 點擊任何車位可將其設為「目標車」，隨後點擊智慧尋路即可自動出庫。
            </div>
        </div>
    </div>

<script>
    // 初始配置：-1=牆壁, 0=空格, -2=出入口, 正數=車位
    const defaultLayout = [
        [1,  2,  3, -1],
        [-2, 0,  5,  6], 
        [7,  8,  9, -1]
    ];
    
    let savedLayout = JSON.parse(JSON.stringify(defaultLayout));
    let currentLayout = JSON.parse(JSON.stringify(defaultLayout));
    
    let stepCount = 0;
    let targetCar = 5; 
    let isEditMode = false; 
    let isAnimating = false; 

    function autoReconstructNumbers() {
        let counter = 1;
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 4; c++) {
                if (currentLayout[r][c] > 0) {
                    currentLayout[r][c] = counter++;
                }
            }
        }
        savedLayout = JSON.parse(JSON.stringify(currentLayout));
    }

    function findGateCoordinates(layout) {
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 4; c++) {
                if (layout[r][c] === -2) return { r, c };
            }
        }
        return null;
    }

    function updateGateDisplay() {
        let gatePos = findGateCoordinates(currentLayout);
        if (gatePos) {
            document.getElementById('gate-display').innerText = `第 ${gatePos.r + 1} 列，第 ${gatePos.c + 1} 欄`;
        } else {
            document.getElementById('gate-display').innerText = "未設定 (將無法出庫)";
        }
    }

    function renderGrid() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        
        for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 4; c++) {

                const cell = document.createElement('div');
                cell.classList.add('car-space');
                
                if (isEditMode) {
                    if (val === -1) {
                        cell.classList.add('wall', 'edit-mode');
                        cell.innerText = "🧱 牆壁";
                    } else if (val === 0) {
                        cell.classList.add('empty');
                        cell.innerText = "⬜ 空位";
                    } else if (val === -2) {

                        cell.
